[project]
name = "pupas-lupas-history-bot"
version = "0.1.0"
description = "Reposts a meme published on the same day in a past year (#MemeThrowback)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptg>=0.6",
    "pillow>=12.2",
    "python-dotenv>=1.2",
    "python-socks[asyncio]>=3.1",
    "telethon>=1.45,<2",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["throwback", "tests", "app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
